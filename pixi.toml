# 32_07_kenning pixi env (managed by ./kenning-box, see README.md). conda-forge python +
# Kenning v0.8.2 from git (not on PyPI) with its extras resolved by pixi/uv and pinned in
# pixi.lock. Env in ./.pixi, caches in ./cache.
# Pinned to main @ ae35386b (2026-10-01, `git describe`: v0.8.2-596), not the v0.8.2 tag: the
# tag's tvm extra needs apache-tvm==0.14.dev273, which is no longer on PyPI (unresolvable);
# main ships TVM 0.18 as Antmicro wheels (dl.antmicro.com), TensorFlow >= 2.21, Python <3.14.
# Renode (for Kenning's Renode/bare-metal runtime) is a pinned portable tarball (config/pins.tsv).
[workspace]
name = "kenning_box"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"

[pypi-dependencies]
# Kenning main = commit ae35386b15104edeae03972670b4901072d7028c (pyproject version 0.8.2)
kenning = { git = "https://github.com/antmicro/kenning", rev = "ae35386b15104edeae03972670b4901072d7028c", extras = ["tensorflow", "tflite", "tvm", "onnxruntime", "uart", "renode", "iree"] }
# `kenning fine-tune-optimizers` always calls compute_detection_metrics, which imports cv2 even for
# classification (upstream main@ae35386b): headless OpenCV instead of the whole object_detection extra.
opencv-python-headless = "*"
# kenning-zephyr-runtime's build_tflite.py (TFLite Micro op resolver header) renders a jinja2 template
# (Kenning lists it only under the `reports` extra).
jinja2 = "*"

# ---- optional environments (not installed by bootstrap/install; ./kenning-box extra install <env>) ----
# automl: Kenning's AutoML flow (AutoPyTorchML = Antmicro's AutoPyTorch fork on SMAC3 1.4 with Hyperband
# budgets), the same engine as ADI/Antmicro's automl-embedded VS Code plugin. CPU-only torch from the
# PyTorch CPU index (no CUDA wheels). Kenning's extras pin torch==2.13.0.
[feature.automl.pypi-dependencies]
kenning = { git = "https://github.com/antmicro/kenning", rev = "ae35386b15104edeae03972670b4901072d7028c", extras = ["tensorflow", "tflite", "tvm", "onnxruntime", "uart", "renode", "iree", "auto_pytorch", "anomaly_detection"] }
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.28.0", index = "https://download.pytorch.org/whl/cpu" }
autoPyTorch = { git = "https://github.com/antmicro/auto-pytorch.git", rev = "1fbf8753015416c650694069faaf3043a9428fda" }
smac = { git = "https://github.com/antmicro/smac3.git", rev = "12afbffc51580ca7cb53297d955c5c02c1a3d985" }

# autogluon: host-side AutoML baseline (AutoGluon TabularPredictor, CPU-only, no torch models).
# AutoGluon models cannot be exported to TFLite/microTVM: never deployable to an MCU.
[feature.autogluon]
dependencies = { python = "3.12.*", pip = "*" }
[feature.autogluon.pypi-dependencies]
"autogluon.tabular" = { version = "==1.6.3", extras = ["lightgbm", "xgboost"] }
numpy = "*"
pandas = "*"

[environments]
automl = { features = ["automl"], solve-group = "automl" }
autogluon = { features = ["autogluon"], no-default-feature = true }
